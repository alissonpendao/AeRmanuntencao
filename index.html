<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&R Manutenção</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2537">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0F2537;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0F2537;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .logo-container {
            width: 170px;
            height: 170px;
            background-color: #0F2537;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.4);
            margin-bottom: 20px;
            border: 3px solid #FFD700;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .app-title {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        .app-slogan {
            background-color: #FFD700;
            color: #0F2537;
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 12px;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        
        /* Cards Principais */
        #login-card, #app-screen {
            background: #FFFFFF;
            padding: 32px 26px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
            display: none;
        }
        #login-card .logo-container {
            width: 115px;
            height: 115px;
            margin: 0 auto 15px auto;
        }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #0F2537;
            font-size: 12px;
            font-weight: 700;
        }
        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 13px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
            background: #f9f9f9;
        }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: #FFD700;
            background: #fff;
        }
        .btn-submit {
            background-color: #FFD700;
            color: #0F2537;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            margin-top: 5px;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        #error-msg {
            color: #D32F2F;
            font-size: 13px;
            font-weight: bold;
            margin-top: 12px;
            display: none;
        }
        #install-container {
            margin-top: 18px;
            display: none;
        }
        .btn-install {
            background-color: transparent;
            border: 1.5px solid #0F2537;
            color: #0F2537;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Painel Interno do App */
        #app-screen {
            text-align: left;
            padding: 24px 20px;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 14px;
            margin-bottom: 18px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .mini-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #FFD700;
            object-fit: cover;
        }
        .user-info h2 {
            color: #0F2537;
            font-size: 17px;
            font-weight: 800;
        }
        .user-info span {
            font-size: 11px;
            background: #FFD700;
            color: #0F2537;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 800;
            display: inline-block;
            margin-top: 2px;
        }
        .btn-logout {
            background: #ffebee;
            color: #D32F2F;
            border: 1px solid #ffcdd2;
            padding: 8px 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Abas de Navegação */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: #f0f2f5;
            color: #555;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #0F2537;
            color: #FFD700;
        }

        /* Lista de Chamados */
        .chamado-card {
            background: #f8f9fa;
            border-left: 4px solid #FFD700;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chamado-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .chamado-unidade {
            font-weight: 800;
            color: #0F2537;
            font-size: 14px;
        }
        .status-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .status-pendente { background: #fff3cd; color: #856404; }
        .status-concluido { background: #d4edda; color: #155724; }
        .chamado-desc {
            font-size: 13px;
            color: #444;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .chamado-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #888;
        }
        .btn-concluir {
            background: #0F2537;
            color: #FFD700;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .empty-state {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 30px 10px;
        }
    </style>
</head>
<body>

    <!-- Tela de Abertura -->
    <div id="splash-screen">
        <div class="logo-container">
            <img src="logo.png" alt="A&R Logo">
        </div>
        <div class="app-title">A&R MANUTENÇÃO</div>
        <div class="app-slogan">⚡ SOLUÇÕES RÁPIDAS E PRECISAS</div>
    </div>

    <!-- Tela de Login -->
    <div id="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="A&R Logo">
        </div>
        <div class="app-title" style="color: #0F2537; font-size: 22px;">A&R MANUTENÇÃO</div>
        <div class="app-slogan">⚡ SOLUÇÕES RÁPIDAS E PRECISAS</div>
        
        <form id="loginForm" style="margin-top: 24px;">
            <div class="input-group">
                <label for="unitLogin">LOGIN DA UNIDADE (OU DEIXE EM BRANCO PARA TÉCNICO)</label>
                <input type="text" id="unitLogin" placeholder="Usuário" autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">SENHA DE ACESSO</label>
                <input type="password" id="password" placeholder="Digite sua senha..." autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Entrar no Sistema</button>
            <div id="error-msg"></div>
        </form>

        <div id="install-container">
            <button id="installBtn" class="btn-install">Instalar App na Tela Inicial</button>
        </div>
    </div>

    <!-- Tela Principal do Aplicativo -->
    <div id="app-screen">
        <div class="app-header">
            <div class="header-left">
                <img src="logo.png" alt="Logo" class="mini-logo">
                <div class="user-info">
                    <h2 id="welcome-title">A&R Manutenção</h2>
                    <span id="role-badge">TÉCNICO</span>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout">Sair</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-lista" onclick="mudarAba('lista')">📋 Chamados</button>
            <button class="tab-btn" id="tab-novo" onclick="mudarAba('novo')">➕ Novo Chamado</button>
        </div>

        <!-- Aba: Lista de Chamados -->
        <div id="view-lista">
            <div id="lista-chamados"></div>
        </div>

        <!-- Aba: Abrir Novo Chamado -->
        <div id="view-novo" style="display: none;">
            <form id="chamadoForm">
                <div class="input-group">
                    <label for="chamadoUnidade">UNIDADE / LOCAL</label>
                    <input type="text" id="chamadoUnidade" placeholder="Ex: Unidade Centro" required>
                </div>
                <div class="input-group">
                    <label for="chamadoTipo">TIPO DE MANUTENÇÃO</label>
                    <select id="chamadoTipo">
                        <option value="Elétrica">⚡ Elétrica</option>
                        <option value="Hidráulica">💧 Hidráulica</option>
                        <option value="Ar Condicionado">❄️ Ar Condicionado</option>
                        <option value="Geral / Predial">🛠️ Geral / Predial</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="chamadoDesc">DESCRIÇÃO DO PROBLEMA</label>
                    <textarea id="chamadoDesc" rows="3" placeholder="Descreva o que precisa ser feito..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">Registrar Chamado</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = '';
        let currentRole = '';

        function showApp(user, role) {
            currentUser = user;
            currentRole = role;
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcome-title').textContent = role === 'Técnico' ? 'Painel Técnico' : user;
            document.getElementById('role-badge').textContent = role === 'Técnico' ? '⚡ TÉCNICO' : '🏢 UNIDADE';
            
            if (role === 'Unidade') {
                document.getElementById('chamadoUnidade').value = user;
            }
            renderChamados();
        }

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('ar_user');
            const savedRole = localStorage.getItem('ar_role');

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    if (savedUser && savedRole) {
                        showApp(savedUser, savedRole);
                    } else {
                        document.getElementById('login-card').style.display = 'block';
                    }
                }, 500);
            }, 1800);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-container').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const unitInput = document.getElementById('unitLogin').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (!passwordInput) {
                errorMsg.textContent = 'Por favor, digite a senha.';
                errorMsg.style.display = 'block';
                return;
            }

            if (passwordInput === '2191') {
                errorMsg.style.display = 'none';
                const user = unitInput === '' ? 'Técnico' : unitInput;
                const role = unitInput === '' ? 'Técnico' : 'Unidade';
                localStorage.setItem('ar_user', user);
                localStorage.setItem('ar_role', role);
                showApp(user, role);
            } else {
                errorMsg.textContent = 'Senha incorreta.';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('ar_user');
            localStorage.removeItem('ar_role');
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('login-card').style.display = 'block';
        });

        function mudarAba(aba) {
            document.getElementById('tab-lista').classList.toggle('active', aba === 'lista');
            document.getElementById('tab-novo').classList.toggle('active', aba === 'novo');
            document.getElementById('view-lista').style.display = aba === 'lista' ? 'block' : 'none';
            document.getElementById('view-novo').style.display = aba === 'novo' ? 'block' : 'none';
            if (aba === 'lista') renderChamados();
        }

        function getChamados() {
            return JSON.parse(localStorage.getItem('ar_chamados') || '[]');
        }

        function saveChamados(lista) {
            localStorage.setItem('ar_chamados', JSON.stringify(lista));
        }

        document.getElementById('chamadoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const lista = getChamados();
            const novo = {
                id: Date.now(),
                unidade: document.getElementById('chamadoUnidade').value.trim(),
                tipo: document.getElementById('chamadoTipo').value,
                desc: document.getElementById('chamadoDesc').value.trim(),
                data: new Date().toLocaleDateString('pt-BR') + ' ' + new Date().toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'}),
                status: 'Pendente'
            };
            lista.unshift(novo);
            saveChamados(lista);
            document.getElementById('chamadoDesc').value = '';
            mudarAba('lista');
        });

        function concluirChamado(id) {
            const lista = getChamados().map(c => {
                if (c.id === id) c.status = 'Concluído';
                return c;
            });
            saveChamados(lista);
            renderChamados();
        }

        function renderChamados() {
            const container = document.getElementById('lista-chamados');
            let lista = getChamados();

            if (currentRole === 'Unidade') {
                lista = lista.filter(c => c.unidade.toLowerCase() === currentUser.toLowerCase());
            }

            if (lista.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum chamado registrado no momento.<br>Clique em <b>+ Novo Chamado</b> para abrir uma OS.</div>';
                return;
            }

            container.innerHTML = lista.map(c => `
                <div class="chamado-card">
                    <div class="chamado-top">
                        <span class="chamado-unidade">${c.unidade} • ${c.tipo}</span>
                        <span class="status-badge ${c.status === 'Pendente' ? 'status-pendente' : 'status-concluido'}">${c.status}</span>
                    </div>
                    <div class="chamado-desc">${c.desc}</div>
                    <div class="chamado-footer">
                        <span>📅 ${c.data}</span>
                        ${c.status === 'Pendente' && currentRole === 'Técnico' ? `<button class="btn-concluir" onclick="concluirChamado(${c.id})">✓ Concluir</button>` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
