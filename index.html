<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&R Manutenção</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F294A">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0F294A; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0F294A; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease; padding: 20px;
        }
        .splash-logo {
            width: 100%; max-width: 280px; height: auto;
            object-fit: contain; margin-bottom: 20px;
        }
        
        .login-card {
            background: white; width: 90%; max-width: 400px; padding: 25px;
            border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center; margin: 20px; max-height: 90vh; overflow-y: auto;
        }
        .login-logo {
            width: 100%; max-width: 160px; height: auto;
            object-fit: contain; margin: 0 auto 15px auto; display: block;
        }
        h1 { font-size: 1.5rem; color: #0F294A; margin-bottom: 5px; font-weight: 800; }
        .slogan {
            display: inline-flex; align-items: center; background: #FFF3CD;
            color: #856403; padding: 4px 12px; border-radius: 50px;
            font-size: 0.85rem; font-weight: bold; margin-bottom: 20px;
        }
        .slogan lightning { color: #FFC107; margin-right: 4px; }
        
        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; color: #495057; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        input {
            width: 100%; padding: 12px; border: 2px solid #CED4DA; border-radius: 12px;
            font-size: 1rem; outline: none; transition: border-color 0.3s;
            background-color: #F8F9FA;
        }
        input:focus { border-color: #FFC107; background-color: white; }
        
        button {
            width: 100%; padding: 14px; background-color: #FFC107; color: #0F294A;
            border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 10px rgba(255,193,7,0.3);
            margin-top: 10px; display: flex; justify-content: center; align-items: center;
        }
        button:active { transform: scale(0.98); }
        
        .install-banner {
            margin-top: 20px; padding-top: 15px; border-top: 1px solid #E9ECEF;
        }
        .install-btn {
            background: transparent; border: 1px dashed #CED4DA; color: #6C757D;
            font-size: 0.9rem; padding: 10px; border-radius: 10px; box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="logo.png" alt="A&R Logo" class="splash-logo">
    </div>

    <div class="login-card">
        <img src="logo.png" alt="A&R Logo" class="login-logo">
        <h1>A&R MANUTENÇÃO</h1>
        <div class="slogan">
            <span>⚡ SOLUÇÕES RÁPIDAS E PRECISAS</span>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <label for="unity">Login da Unidade (ou deixe em branco para técnico)</label>
                <input type="text" id="unity" placeholder="Ex: saogeraldo, loja01...">
            </div>
            
            <div class="input-group">
                <label for="password">Senha de Acesso</label>
                <input type="password" id="password" placeholder="Digite sua senha...">
            </div>
            
            <button type="submit">Entrar no Sistema</button>
        </form>

        <div class="install-banner" id="installBanner" style="display: none;">
            <button id="installBtn" class="install-btn">Instalar App na Tela Inicial</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker registrado com sucesso.'))
            .catch(err => console.log('Erro ao registrar Service Worker:', err));
        }

        window.onload = () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
            }, 1000);
        };

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', (e) => {
            document.getElementById('installBanner').style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('Usuário aceitou o prompt de instalação');
                    }
                    deferredPrompt = null;
                });
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Função de login conectada ao Firebase.');
        });
    </script>
</body>
</html>
