<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&R Manutenção</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2537">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #0F2537;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0F2537;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .logo-container {
            width: 180px;
            height: 180px;
            background-color: #0F2537;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .app-title {
            color: #FFFFFF;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .app-slogan {
            background-color: #FFD700;
            color: #0F2537;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
        }
        
        #login-card, #app-screen {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: none;
        }
        #login-card .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 13px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #FFD700;
        }
        .btn-submit {
            background-color: #FFD700;
            color: #0F2537;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #e6c200;
        }
        #error-msg {
            color: #D32F2F;
            font-size: 14px;
            font-weight: bold;
            margin-top: 12px;
            display: none;
        }
        #install-container {
            margin-top: 20px;
            display: none;
        }
        .btn-install {
            background-color: transparent;
            border: 1px solid #0F2537;
            color: #0F2537;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Estilos do Sistema Interno */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .user-info {
            text-align: left;
        }
        .user-info h2 {
            color: #0F2537;
            font-size: 18px;
        }
        .user-info span {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }
        .btn-logout {
            background: #D32F2F;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .menu-btn {
            background: #0F2537;
            color: #FFD700;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:active {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <!-- Tela de Abertura -->
    <div id="splash-screen">
        <div class="logo-container">
            <img src="logo.png" alt="A&R Logo">
        </div>
        <div class="app-title">A&R MANUTENÇÃO</div>
        <div class="app-slogan">⚡ SOLUÇÕES RÁPIDAS E PRECISAS</div>
    </div>

    <!-- Tela de Login -->
    <div id="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="A&R Logo">
        </div>
        <div class="app-title" style="color: #0F2537; font-size: 22px;">A&R MANUTENÇÃO</div>
        <div class="app-slogan">⚡ SOLUÇÕES RÁPIDAS E PRECISAS</div>
        
        <form id="loginForm" style="margin-top: 25px;">
            <div class="input-group">
                <label for="unitLogin">LOGIN DA UNIDADE (OU DEIXE EM BRANCO PARA TÉCNICO)</label>
                <input type="text" id="unitLogin" placeholder="Usuário" autocomplete="username">
            </div>
            <div class="input-group">
                <label for="password">SENHA DE ACESSO</label>
                <input type="password" id="password" placeholder="Digite sua senha..." autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Entrar no Sistema</button>
            <div id="error-msg"></div>
        </form>

        <div id="install-container">
            <button id="installBtn" class="btn-install">Instalar App na Tela Inicial</button>
        </div>
    </div>

    <!-- Tela Principal do Aplicativo -->
    <div id="app-screen">
        <div class="app-header">
            <div class="user-info">
                <h2 id="welcome-title">Olá, Técnico</h2>
                <span id="role-badge">A&R MANUTENÇÃO</span>
            </div>
            <button id="logoutBtn" class="btn-logout">Sair</button>
        </div>

        <div class="menu-grid">
            <button class="menu-btn" onclick="alert('Módulo de Ordens de Serviço')">📋 Ordens de Serviço</button>
            <button class="menu-btn" onclick="alert('Módulo de Novo Chamado')">➕ Abrir Novo Chamado</button>
            <button class="menu-btn" onclick="alert('Módulo de Relatórios')">📊 Relatórios de Manutenção</button>
        </div>
    </div>

    <script>
        function showApp(user, role) {
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('welcome-title').textContent = `Olá, ${user}`;
            document.getElementById('role-badge').textContent = role === 'Técnico' ? 'PERFIL: TÉCNICO' : `UNIDADE: ${user.toUpperCase()}`;
        }

        window.addEventListener('load', () => {
            const savedUser = localStorage.getItem('ar_user');
            const savedRole = localStorage.getItem('ar_role');

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    if (savedUser && savedRole) {
                        showApp(savedUser, savedRole);
                    } else {
                        document.getElementById('login-card').style.display = 'block';
                    }
                }, 500);
            }, 2000);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            }
        });

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-container').style.display = 'block';
        });

        document.getElementById('installBtn').addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                });
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const unitInput = document.getElementById('unitLogin').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            
            if (!passwordInput) {
                errorMsg.textContent = 'Por favor, digite a senha.';
                errorMsg.style.display = 'block';
                return;
            }

            if (passwordInput === '2191') {
                errorMsg.style.display = 'none';
                const user = unitInput === '' ? 'Técnico' : unitInput;
                const role = unitInput === '' ? 'Técnico' : 'Unidade';
                localStorage.setItem('ar_user', user);
                localStorage.setItem('ar_role', role);
                showApp(user, role);
            } else {
                errorMsg.textContent = 'Senha incorreta.';
                errorMsg.style.display = 'block';
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('ar_user');
            localStorage.removeItem('ar_role');
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('login-card').style.display = 'block';
        });
    </script>
</body>
</html>
