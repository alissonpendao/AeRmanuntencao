<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&R Manutenção - Sistema de Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- TELA DE LOGIN -->
    <div id="login-view" class="fixed inset-0 bg-gray-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-4 text-2xl font-bold">
                    A&R
                </div>
                <h1 class="text-2xl font-bold text-gray-900">A&R Manutenção</h1>
                <p class="text-sm text-gray-500 mt-1">Sistema de Gestão e Chamados</p>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">E-mail ou Usuário da Loja</label>
                    <input type="text" id="login-email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Ex: castro ou saogeraldo">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                    <input type="password" id="login-pass" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••••••">
                </div>
                <div id="login-err" class="text-red-500 text-sm hidden">E-mail ou senha incorretos.</div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- TELA DO APLICATIVO -->
    <div id="app-view" class="hidden flex-1 flex flex-col">
        <!-- HEADER -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <span class="font-bold text-lg text-gray-900" id="app-title">A&R Manutenção e Instalação</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-badge" class="text-xs bg-blue-100 text-blue-800 font-medium px-2.5 py-1 rounded-full"></span>
                    <button id="btn-logout" class="text-gray-500 hover:text-red-600 p-2 rounded-lg transition" title="Sair">
                        <i class="fa-solid fa-right-from-bracket text-lg"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div class="mb-6 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-900" id="page-heading">Lista de Chamados</h2>
            </div>

            <!-- CONTAINER DE CHAMADOS -->
            <div id="chamados-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-gray-500 col-span-full text-center py-8">Carregando chamados...</p>
            </div>
        </main>
    </div>

    <!-- SCRIPT FIREBASE E APLICAÇÃO -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCCBKbHlbd5Hr3y3raEPx4QRbVh5z7",
            authDomain: "aermanutencao.firebaseapp.com",
            projectId: "aermanutencao",
            storageBucket: "aermanutencao.appspot.com",
            messagingSenderId: "786994474703",
            appId: "1:786994474703:web:dbf7bf64afeef28cd14be5",
            measurementId: "G-EKKRTEMJ85"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const ADMIN_EMAIL = "aermanutencao@superdito.com.br";
        
        const loginView = document.getElementById("login-view");
        const appView = document.getElementById("app-view");
        const loginForm = document.getElementById("login-form");
        const loginEmail = document.getElementById("login-email");
        const loginPass = document.getElementById("login-pass");
        const loginErr = document.getElementById("login-err");
        const btnLogout = document.getElementById("btn-logout");
        const userBadge = document.getElementById("user-badge");
        const chamadosContainer = document.getElementById("chamados-container");

        function normalizeText(str) {
            return (str || "").toLowerCase().trim();
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginErr.classList.add("hidden");
            const inputVal = normalizeText(loginEmail.value);
            
            let candidateEmails = [inputVal];
            if (!inputVal.includes("@")) {
                candidateEmails = [
                    `${inputVal}@aermanutencao.com.br`,
                    `${inputVal}@aermanutencao.local`
                ];
            }

            let logged = false;
            for (let email of candidateEmails) {
                try {
                    await signInWithEmailAndPassword(auth, email, loginPass.value);
                    logged = true;
                    break;
                } catch (err) {
                    console.warn("Tentativa falhou para:", email);
                }
            }

            if (!logged) {
                loginErr.classList.remove("hidden");
            }
        });

        btnLogout.addEventListener("click", () => {
            signOut(auth);
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginView.classList.add("hidden");
                appView.classList.remove("hidden");
                
                const email = user.email || "";
                if (email === ADMIN_EMAIL || email.includes("admin")) {
                    userBadge.textContent = "Administrador";
                    carregarChamados(null);
                } else {
                    const storeName = email.split("@")[0];
                    userBadge.textContent = `Loja: ${storeName}`;
                    carregarChamados(storeName);
                }
            } else {
                loginView.classList.remove("hidden");
                appView.classList.add("hidden");
            }
        });

        function carregarChamados(storeFilter) {
            let q = collection(db, "chamados");
            if (storeFilter) {
                q = query(collection(db, "chamados"), where("loja", "==", storeFilter));
            }

            onSnapshot(q, (snapshot) => {
                chamadosContainer.innerHTML = "";
                if (snapshot.empty) {
                    chamadosContainer.innerHTML = `<p class="text-gray-500 col-span-full text-center py-8">Nenhum chamado encontrado para esta loja.</p>`;
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const c = docSnap.data();
                    const card = document.createElement("div");
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="font-semibold text-gray-900">${c.equipamento || 'Equipamento'}</span>
                                <span class="text-xs px-2.5 py-1 rounded-full bg-yellow-100 text-yellow-800 font-medium">${c.status || 'aberto'}</span>
                            </div>
                            <p class="text-sm text-gray-600 mb-4">${c.descricao || 'Sem descrição'}</p>
                        </div>
                        <div class="text-xs text-gray-400 border-t pt-3 flex justify-between">
                            <span>Loja: ${c.loja || 'N/A'}</span>
                            <span>${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : ''}</span>
                        </div>
                    `;
                    chamadosContainer.appendChild(card);
                });
            }, (error) => {
                console.error("Erro ao carregar chamados:", error);
                chamadosContainer.innerHTML = `<p class="text-red-500 col-span-full text-center py-8">Erro ao carregar dados do banco.</p>`;
            });
        }
    </script>
</body>
</html>
